# First block doesn't need to be translated for epubcheck, as @murata0204 noted in
# https://github.com/IDPF/epubcheck/pull/472#issuecomment-58265808

# Properties file specifying messages
enumeration_param="enumeration" ファセットはパラメタには許されていません: 代わりに "value" 要素を使ってください
whiteSpace_param="whiteSpace" ファセットはパラメタには許されていません
unrecognized_param=認識できないパラメタです "{0}"
invalid_regex=不正な正規表現です: {0}
not_ordered=パラメタは順序つきデータ型にしか適用できません
invalid_limit="{0}" はベースのデータ型 {1} により使えません
no_length=ベースのデータ型は長さの単位を定義していません
scale_not_derived_from_decimal="scale" パラメタは "decimal" から派生したデータ型にしか適用できません
scale_not_non_negative_integer="scale" パラメタは負でない整数でなければなりません
length_not_non_negative_integer="length" パラメタは負でない整数でなければなりません
precision_not_derived_from_decimal="precision" パラメタは "decimal" から派生したデータ型にしか適用できません
precision_not_positive_integer="precision" パラメタは正の整数でなければなりません
regex_impl_not_found=正規表現の実装が見つかりません; JDK 1.4 を使うか、 Xerces2 をクラスパスに追加してください
regex_internal_error=正規表現データ型 {0} の内部エラー

# validation errors
length_violation={0}の長さは {1} でなくてはなりません. (長さが {2} でした)
max_length_violation={0}の長さは最大 {1} までです. (長さが {2} でした)
min_length_violation={0}の長さは最低でも {1} 必要です. (長さが {2} でした)
min_inclusive_violation={0}は {1} より大きいかまたは等しくなくてはなりません.
min_exclusive_violation={0}は {1} より大きくなくてはなりません.
max_inclusive_violation={0}は {1} より小さいかまたは等しくなくてはなりません.
max_exclusive_violation={0}は {1} より小さくなくてはなりません.
pattern_violation={0}は以下の正規表現にマッチしなくてはなりません.  "{1}"
entity_violation=DTDで定義された解析対象外実体の名前でなくてはなりません.
undeclared_prefix=修飾名(QName)でなくてはなりません. 接頭辞があるなら宣言済みでなくてはなりません. (接頭辞 "{0}" が宣言されていません)
precision_violation={0} の有効桁は最大 {1} までです. ({2} 桁ありました)
precision_1_violation={0} の有効桁はちょうど 1 桁でなくてはなりません. ({1} 桁ありました)
# part of the point is to avoid ugly "digit(s)" in the error message
scale_violation=小数点以下の有効桁が最大 {0} 桁の10進数でなくてはなりません. ({1} 桁ありました)
scale_0_violation=小数点以下の桁がない10進数でなくてはなりません.
scale_1_violation=小数点以下の有効桁が最大 1 桁の10進数でなくてはなりません. ({0} 桁ありました)
lexical_violation={0}でなくてはなりません.

