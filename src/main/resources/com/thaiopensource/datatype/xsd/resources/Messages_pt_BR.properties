# First block doesn't need to be translated for epubcheck, as @murata0204 noted in
# https://github.com/IDPF/epubcheck/pull/472#issuecomment-58265808

# Properties file specifying messages
enumeration_param=restrição no elemento "enumeration" não é permitida como parâmetro: use o elemento "value" no lugar
whiteSpace_param=restrição no elemento "whiteSpace" não é permitida como parâmetro
unrecognized_param=parâmetro desconhecido "{0}"
invalid_regex=expressão regular inválida: {0}
not_ordered=o parâmetro só pode ser aplicado para tipo de dado ordenado
invalid_limit="{0}" não é permitido pelo tipo base: {1}
no_length=o tipo de dado base não define uma unidade de comprimento
scale_not_derived_from_decimal=o parâmetro "scale" só pode ser aplicado a tipo de dado derivado de "decimal"
scale_not_non_negative_integer=o parâmetro "scale" deve ser um inteiro não negativo
length_not_non_negative_integer=o parâmetro "length" deve ser um inteiro não negativo
precision_not_derived_from_decimal=o parâmetro "precision" só pode ser aplicado para tipop de dado derivado de "decimal"
precision_not_positive_integer=o parâmetro "precision" deve ser um inteiro positivo
regex_impl_not_found=não é possível encontrar uma implementação de expressão regular; use o JDK 1.4 ou adicione Xerces2 ao seu classpath
regex_internal_error=erro interno em expressão regular para tipo de dado {0}

# validation errors
length_violation=deve ser {0} com comprimento igual a {1} (o comprimento real era {2})
max_length_violation=deve ser {0} com comprimento de no máximo {1} (o comprimento real era {2})
min_length_violation=deve ser {0} com comprimento de no mínimo {1} (o comprimento real era {2})
min_inclusive_violation=deve ser {0} maior ou igual a {1}
min_exclusive_violation=deve ser {0} maior do que {1}
max_inclusive_violation=deve ser {0} menor ou igual a {1}
max_exclusive_violation=deve ser {0} menor do que {1}
pattern_violation=deve ser {0} correspondendo à expressão regular "{1}"
entity_violation=deve ser um nome declarado no DTD como uma entidade não processada
undeclared_prefix=deve ser um QName cujo prefixo, se existir, está declarado (o prefixo "{0}" não está declarado)
precision_violation=deve ser {0} com no máximo {1} dígitos significativos (encontrados {2} dígitos)
precision_1_violation=deve ser {0} com exatamente um dígito significativo (encontrados {1} dígitos)
# part of the point is to avoid ugly "digit(s)" in the error message
scale_violation=deve ser um número decimal com no máximo {0} dígitos significativos depois do ponto (encontrados {1} dígitos)
scale_0_violation=deve ser um número decimal sem qualquer dígito significativo depois do ponto
scale_1_violation=deve ser um número decimal com no máximo um dígito significativo depois do ponto (encontrados {0} dígitos)
lexical_violation=deve ser {0}

# fragments substituted in above
lexical_space_string=uma string
lexical_space_uri=uma URI
lexical_space_boolean=um booleano
lexical_space_decimal=um número decimal
lexical_space_float=um número de ponto flutuante
lexical_space_duration=uma duração
lexical_space_hex=uma string hexadecimal
lexical_space_base64=uma string em base64
lexical_space_integer=um inteiro
lexical_space_name=um nome XML
lexical_space_ncname=um nome XML sem dois pontos
lexical_space_nmtoken=um NMTOKEN XML
lexical_space_qname=um QName XML
lexical_space_list=uma lista delimitada por espaços
lexical_space_list_ncname=uma lista de nomes XML sem dois pontos
lexical_space_list_nmtoken=uma lista de NMTOKENs XML
lexical_space_date_y_m_d_time=uma data/hora ISO
lexical_space_time=uma hora ISO
lexical_space_date_y_m_d=uma data ISO
lexical_space_date_y_m=um ano/mês ISO
lexical_space_date_y=um ano
lexical_space_date_m_d=um dia/mês ISO (na forma --MM-DD)
lexical_space_date_m=um mês ISO (na forma --MM)
lexical_space_date_d=um dia do mês ISO (na forma --DD)
lexical_space_language=um identificador de linguagem RFC 3066
