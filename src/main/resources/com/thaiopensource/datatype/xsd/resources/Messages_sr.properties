# First block doesn't need to be translated for epubcheck, as @murata0204 noted in
# https://github.com/IDPF/epubcheck/pull/472#issuecomment-58265808

# Properties file specifying messages
enumeration_param=фасета ,,enumeration” није дозвољена као параметар: уместо ње употребите елемент „value”
whiteSpace_param=фасета „whiteSpace” није дозвољена као параметар
unrecognized_param=непрепознати параметар „{0}”
invalid_regex=неисправни регуларни израз: {0}
not_ordered=параметар може да се примени само на уређени тип података
invalid_limit=„{0}” није дозвољен као базни тип: {1}
no_length=базни тип података не дефинише јединицу дужине
scale_not_derived_from_decimal=параметар „scale” може да се примени само на тип података изведен из „decimal”
scale_not_non_negative_integer=параметар „scale” мора да буде цео број који није негативан
length_not_non_negative_integer=параметар „length” мора да буде цео број који није негативан
precision_not_derived_from_decimal=параметар „precision” може да се примени само на тип података изведен из „decimal”
precision_not_positive_integer=параметар „precision” мора да буде позитивни цео број
regex_impl_not_found=не може да се пронађе имплементација регуларног израза; користите JDK 1.4 или додајте Xerces2 у свој classpath
regex_internal_error=интерна грешка у регуларном изразу за тип података {0}

# validation errors
length_violation=мора бити {0} са дужином једнаком {1} (стварна дужина је {2})
max_length_violation=мора бити {0} са дужином највише {1} (стварна дужина је {2})
min_length_violation=мора бити {0} са дужином барем {1} (стварна дужина је {2})
min_inclusive_violation=мора бити {0} веће од или једнако {1}
min_exclusive_violation=мора бити {0} веће од {1}
max_inclusive_violation=мора бити {0} мање од или једнако {1}
max_exclusive_violation=мора бити {0} мање од {1}
pattern_violation=мора бити {0} подудара регуларни израз ,,{1}”
entity_violation=мора бити име декларисано у DTD као непарсирани ентитет
undeclared_prefix=мора да буде QName чији је префикс, ако постоји, декларисан (префикс „{0}” није декларисан)
precision_violation=мора да буде {0} са највише {1} значајних цифара (пронађено је {2} цифара)
precision_1_violation=мора да буде {0} са тачно јендом значајном цифром (пронађено је {1} цифара)
# part of the point is to avoid ugly "digit(s)" in the error message
scale_violation=мора да буде децимални број са највише {0} значајних цифара након децималне тачке (пронађено је {1} цифара)
scale_0_violation=мора да буде децимални број без значајних цифара након децималне тачке
scale_1_violation=мора да буде децимални број са највише једном значајном цифром након децималне тачке (пронађено је {0} цифара)
lexical_violation=мора да буде {0}

