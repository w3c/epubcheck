# First block doesn't need to be translated for epubcheck, as @murata0204 noted in
# https://github.com/IDPF/epubcheck/pull/472#issuecomment-58265808

# Properties file specifying messages
enumeration_param=la facette "enumeration" n’est pas autorisée en tant que paramètre : utiliser l’élément "value".
whiteSpace_param=la facette "whiteSpace" n’est pas autorisée en tant que paramètre
unrecognized_param=paramètre "{0}" non reconnu
invalid_regex=expression régulière invalide : {0}
not_ordered=le paramètre peut seulement être appliqué à un type de donnée ordonné
invalid_limit="{0}" n’est pas autorisé par le type de base : {1}
no_length=le type de base ne définit pas une unité de longueur
scale_not_derived_from_decimal=le paramètre "scale" ne peut être appliqué qu’aux types dérivés de "decimal"
scale_not_non_negative_integer=le paramètre "scale" doit être un entier non négatif
length_not_non_negative_integer=le paramètre "length" doit être un entier non négatif
precision_not_derived_from_decimal=le paramètre "precision" ne peut être appliqué qu’aux types dérivés de "decimal"
precision_not_positive_integer=le paramètre "precision" doit être un entier non négatif
regex_impl_not_found=Aucun moteur d’expressions régulières n’a pu être trouvé; utilisez JDK 1.4 ou ajoutez Xerces2 à votre classpath
regex_internal_error=erreur interne dans l’expression régulière pour le type de données {0}

# validation errors
length_violation=doit être {0} avec une longueur égale à {1} (la longueur trouvée est {2})
max_length_violation=doit être {0} avec une longueur d’au plus {1} (la longueur trouvée est {2})
min_length_violation=doit être {0} avec une longueur d’au moins {1} (la longueur trouvée est {2})
min_inclusive_violation=doit être {0} supérieur ou égal à {1}
min_exclusive_violation=doit être {0} supérieur à {1}
max_inclusive_violation=doit être {0} inférieur ou égal à {1}
max_exclusive_violation=doit être {0} inférieur à {1}
pattern_violation=doit être {0} satisfaisant l’expression régulière "{1}"
entity_violation=doit être un nom déclaré dans la DTD en tant qu’entité non-parsée
undeclared_prefix=doit un être un QName avec un préfixe, si spécifié, déclaré (le préfixe "{0}" n’est pas déclaré)
precision_violation=doit être {0} avec au plus {1} chiffres significatifs ({2} chiffres ont été trouvés)
precision_1_violation=doit être {0} avec exactement un chiffre significatif ({1} chiffres ont été trouvés)
# part of the point is to avoid ugly "digit(s)" in the error message
scale_violation=doit être un nombre décimal avec au plus {0} chiffres significatifs après la virgule ({1} chiffres ont été trouvés)
scale_0_violation=doit être un nombre décimal sans aucun chiffre significatif après la virgule
scale_1_violation=doit être un nombre décimal avec au plus un chiffre significatif après la virgule ({0} chiffres ont été trouvés)
lexical_violation=doit être {0}

# fragments substituted in above
lexical_space_string=une chaîne de caractères
lexical_space_uri=une URI
lexical_space_boolean=un booléen
lexical_space_decimal=un nombre décimal
lexical_space_float=un nombre en virgule flottante
lexical_space_duration=une durée
lexical_space_hex=une chaîne hexadécimale
lexical_space_base64=une chaîne base64
lexical_space_integer=un entier
lexical_space_name=un nom XML
lexical_space_ncname=un nom XML sans double point
lexical_space_nmtoken=un NMTOKEN XML
lexical_space_qname=un QName XML
lexical_space_list=une liste délimitée pas espaces blancs
lexical_space_list_ncname=une liste de noms XML sans doubles points
lexical_space_list_nmtoken=une liste de NMTOKENs XML
lexical_space_date_y_m_d_time=une date et heure ISO
lexical_space_time=une heure ISO
lexical_space_date_y_m_d=une date ISO
lexical_space_date_y_m=une année et mois ISO
lexical_space_date_y=une année
lexical_space_date_m_d=un mois et jour ISO (de forme --MM-DD)
lexical_space_date_m=un mois ISO (de forme --MM)
lexical_space_date_d=un jour ISO (de forme --DD)
lexical_space_language=un identificateur de langage RFC 3066
