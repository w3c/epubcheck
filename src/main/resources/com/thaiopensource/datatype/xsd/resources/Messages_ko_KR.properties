# Properties file specifying messages
enumeration_param="열거형(enumeration)" 속성은 매개변수로 사용할 수 없습니다. 대신 "값(value)" 요소를 사용하세요.
whiteSpace_param="whiteSpace" 속성은 매개변수로 사용할 수 없습니다.
unrecognized_param=인식 할 수없는 매개 변수 "{0}"
invalid_regex=잘못된 정규식 : {0}
not_ordered=매개변수는 순서형 데이터 타입에만 적용할 수 있습니다.
invalid_limit="{0}"은(는) 기본 유형 {1}에서 허용되지 않습니다.
no_length=기본 데이터 형식은 길이 단위를 정의하지 않습니다.
scale_not_derived_from_decimal="scale" 매개변수는 "decimal"에서 파생된 데이터 타입에만 적용할 수 있습니다.
scale_not_non_negative_integer="scale"매개 변수는 음수가 아닌 정수 여야합니다.
length_not_non_negative_integer="length"매개 변수는 음수가 아닌 정수 여야합니다.
precision_not_derived_from_decimal="precision"매개 변수는 "decimal"에서 파생 된 데이터 유형에만 적용할 수 있습니다.
precision_not_positive_integer="precision"매개 변수는 양의 정수 여야합니다.
regex_impl_not_found=정규 표현식 구현을 찾을 수 없습니다. JDK 1.4를 사용하거나 클래스패스에 Xerces2를 추가하세요.
regex_internal_error=데이터 형식 {0}에 대한 정규식의 내부 오류입니다.

# validation errors
length_violation=길이가 {1}인 {0}이어야합니다 (실제 길이는 {2}).
max_length_violation=길이가 {1}인 {0}이어야합니다. (실제 길이는 {2})
min_length_violation=길이가 {1} 이상인 {0}이어야합니다 (실제 길이는 {2}).
min_inclusive_violation={0}이(가) {1}보다 크거나 같아야합니다.
min_exclusive_violation={0}이(가) {1}보다 커야합니다.
max_inclusive_violation={0}이(가) {1}보다 작거나 같아야합니다.
max_exclusive_violation={0}이(가) {1}보다 작아야합니다.
pattern_violation=정규식 "{1}"에 일치하는 {0}이어야합니다.
entity_violation=반드시 DTD에서 선언된 미해석 엔티티의 이름이어야 합니다.
undeclared_prefix=접두사 "{0}"이(가) 선언되지 않았으므로 QName으로 사용할 수 없습니다.
precision_violation={0} 값은 반드시 {1}개의 유효 자릿수를 가져야 합니다. ({2}개의 자릿수 발견)
precision_1_violation={0} 값은 정확히 한 개의 유효 자릿수를 가져야 합니다. ({1} 자릿수 발견)
# part of the point is to avoid ugly "digit(s)" in the error message
scale_violation=소수점 이하 자릿수는 최대 {0}자리까지 허용된 십진수여야 합니다. ({1}자리 발견됨)
scale_0_violation=소수점 이하 자릿수가 없는 십진수여야합니다.
scale_1_violation=소수점 이하 1 자릿수의 유효 숫자가있는 10 진수 여야합니다 ({0} 자릿수 발견됨)
lexical_violation=반드시 {0}이어야 합니다.

