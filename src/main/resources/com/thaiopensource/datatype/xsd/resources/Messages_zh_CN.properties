# First block doesn't need to be translated for epubcheck, as @murata0204 noted in
# https://github.com/IDPF/epubcheck/pull/472#issuecomment-58265808

# Properties file specifying messages
enumeration_param="enumeration" facet 不允许作为参数：使用 "value" 元素代替
whiteSpace_param="whiteSpace" facet 不允许作为参数
unrecognized_param=无法识别的参数 "{0}"
invalid_regex=无效的正则表达式：{0}
not_ordered=参数只能用于有序的数据类型
invalid_limit=基础类型 {1} 不允许使用 "{0}"
no_length=基础数据类型没有定义长度单位
scale_not_derived_from_decimal="scale" 参数只能用于 "decimal" 派生的数据类型
scale_not_non_negative_integer="scale" 参数必须是非负整数
length_not_non_negative_integer="length" 参数必须是非负整数
precision_not_derived_from_decimal="precision" 参数只能用于 "decimal" 派生的数据类型
precision_not_positive_integer="precision" 参数必须是正整数
regex_impl_not_found=无法找到正则表达式的实现；使用 JDK 1.4 或将 Xerces2 添加到 classpath
regex_internal_error=对数据类型 {0} 的正则表达式发生内部错误

# validation errors
length_violation=必须是长度等于 {1} 的 {0}（实际长度是 {2}）
max_length_violation=必须是长度最多为 {1} 的 {0} （实际长度是 {2}）
min_length_violation=必须是长度最少为 {1} 的 {0}（实际长度是 {2}）
min_inclusive_violation=必须是大于等于 {1} 的 {0}
min_exclusive_violation=必须是大于 {1} 的 {0}
max_inclusive_violation=必须是小于等于 {1} 的 {0}
max_exclusive_violation=必须是小于 {1} 的 {0}
pattern_violation=必须是符合正则表达式 "{1}" 的 {0}
entity_violation=必须是 DTD 中声明的未解析实体名称
undeclared_prefix=必须是 QName，且如果有前缀，必须声明过（前缀 "{0}" 没有声明）
precision_violation=必须是至少有 {1} 个有效数字的 {0} （找到了 {2} 个数字）
precision_1_violation=必须是只有一个有效数字的 {0}（找到 {1} 个数字）
# part of the point is to avoid ugly "digit(s)" in the error message
scale_violation=必须是小数点后有最多 {0} 个有效数字的十进制数字（找到 {1} 个数字）
scale_0_violation=必须是小数点后不存在有效数字的十进制数字
scale_1_violation=必须是小数点后有最多一个有效数字的十进制数字（找到 {0} 个数字）
lexical_violation=必须是 {0}

# fragments substituted in above
lexical_space_string=字符串
lexical_space_uri=URI
lexical_space_boolean=布尔值
lexical_space_decimal=十进制数
lexical_space_float=浮点数
lexical_space_duration=一段时间
lexical_space_hex=十六进制字符串
lexical_space_base64=base64 字符串
lexical_space_integer=整数
lexical_space_name=XML 名称
lexical_space_ncname=无冒号 XML 名称
lexical_space_nmtoken=XML NMTOKEN
lexical_space_qname=XML QName
lexical_space_list=空格分隔的列表
lexical_space_list_ncname=无冒号 XML 名称的列表XML
lexical_space_list_nmtoken=XML NMTOKEN 列表
lexical_space_date_y_m_d_time=ISO 日期时间
lexical_space_time=ISO 时间
lexical_space_date_y_m_d=ISO 日期
lexical_space_date_y_m=ISO 年月
lexical_space_date_y=年份
lexical_space_date_m_d=ISO 月日（形式为 --MM-DD）
lexical_space_date_m=ISO 月（形式为 --MM）
lexical_space_date_d=ISO 月份的日期（形式为 ---DD）
lexical_space_language=RFC 3066 语言标识符
