# First block doesn't need to be translated for epubcheck, as @murata0204 noted in
# https://github.com/IDPF/epubcheck/pull/472#issuecomment-58265808

# Properties file specifying messages
enumeration_param="enumeration" no es un parámetro válido: utilice el elemento "value" en su lugar
whiteSpace_param="whiteSpace" no es un parámetro válido
unrecognized_param="{0}" es un parámetro desconocido
invalid_regex=expresión regular no válida: {0}
not_ordered=el parámetro solo puede aplicarse al datatype ordenado
invalid_limit="{0}" no está permitido por el tipo base: {1}
no_length=el datatype base no define la unidad de longitud
scale_not_derived_from_decimal=el parámetro "scale" solo puede aplicarse al datatype derivado de "decimal"
scale_not_non_negative_integer=el parámetro "scale" debe ser un número entero no negativo
length_not_non_negative_integer=el parámetro "length" debe ser un número entero no negativo
precision_not_derived_from_decimal=el parámetro "precision" solo se aplica al datatype derivado de "decimal"
precision_not_positive_integer=el parámetro "precision" debe ser un número entero positivo
regex_impl_not_found=no se ha encontrado la implementación de la expresión regular; utilice JDK 1.4 o añada Xerces2 a su ruta
regex_internal_error=error interno en la expresión regular para el datatype {0}

# validation errors
length_violation=debe ser {0} con una longitud igual a {1} (la longitud es de {2})
max_length_violation=debe ser {0} con una longitud máxima de {1} (la longitud es de {2})
min_length_violation=debe ser {0} con una longitud de al menos {1} (la longitud es de {2})
min_inclusive_violation=debe ser {0} mayor o igual que {1}
min_exclusive_violation=debe ser {0} mayor que {1}
max_inclusive_violation=debe ser {0} menor o igual que {1}
max_exclusive_violation=debe ser {0} menor que {1}
pattern_violation=debe ser {0} que concuerde con la expresión regular "{1}"
entity_violation=debe ser un nombre declarado en e DTD como entidad no analizada
undeclared_prefix=debe ser un QName cuyo prefijo, si existe, se haya declarado (el prefijo "{0}" no se ha declarado)
precision_violation=debe ser {0} con un máximo de {1} dígito (hay {2} dígitos)
precision_1_violation=debe ser {0} con un solo dígito (hay {1} dígitos)
# part of the point is to avoid ugly "digit(s)" in the error message
scale_violation=debe ser un número decimal con un máximo de {0} dígitos después del punto (hay {1} dígitos)
scale_0_violation=debe ser un número decimal sin dígitos después del punto
scale_1_violation=debe ser un número decimal con un máximo de 1 dígito después del punto (hay {0} dígitos)
lexical_violation=debe ser {0}

# fragments substituted in above
lexical_space_string=una cadena
lexical_space_uri=un URI
lexical_space_boolean=un operador booleano
lexical_space_decimal=un número decimal
lexical_space_float=un número de punto flotante
lexical_space_duration=una duración
lexical_space_hex=una cadena hexadecimal
lexical_space_base64=una cadena base64
lexical_space_integer=un número entero
lexical_space_name=un nombre XML
lexical_space_ncname=un nombre XML sin dos puntos
lexical_space_nmtoken=un NMTOKEN XML
lexical_space_qname=un QName XML
lexical_space_list=una lista delimitada por espacios en blanco
lexical_space_list_ncname=una lista de nombres XML sin puntos
lexical_space_list_nmtoken=una lista de NMTOKENs XML
lexical_space_date_y_m_d_time=una fecha y hora ISO
lexical_space_time=una hora ISO
lexical_space_date_y_m_d=una fecha ISO
lexical_space_date_y_m=un año y mes ISO
lexical_space_date_y=un año
lexical_space_date_m_d=un día y mes ISO (con el formato --MM-DD)
lexical_space_date_m=un mes ISO (con el formato --MM)
lexical_space_date_d=un día del mes ISO (con el formato ---DD)
lexical_space_language=un identificador de idioma RFC 3066
