# First block doesn't need to be translated for epubcheck, as @murata0204 noted in
# https://github.com/IDPF/epubcheck/pull/472#issuecomment-58265808

# Properties file specifying messages
enumeration_param="enumeration" facet 不允許作為參數：使用 "value" 元素取代
whiteSpace_param="whiteSpace" facet 不允許作為參數
unrecognized_param=無法辨識的參數 "{0}"
invalid_regex=無效的正規表達式： {0}
not_ordered=參數只能應用於依序排列的資料類型
invalid_limit="{0}" 因為基礎型別 {1} 而不允許使用
no_length=基礎資料類型沒有定義一個長度單位
scale_not_derived_from_decimal="scale" 僅能應用在由 "decimal" 派生的資料類型
scale_not_non_negative_integer="scale" 參數必須為非負整數
length_not_non_negative_integer="length" 參數必須為非負整數
precision_not_derived_from_decimal="precision" 參數只能應用在由  "decimal" 派生的資料類型
precision_not_positive_integer="precision" 參數必須為正整數
regex_impl_not_found=無法找到實裝的正則表現式；請使用JDK 1.4版，或者將Xerces2加入你的classpath
regex_internal_error=對資料類型 {0} 的正規表現式發生內部錯誤

# validation errors
length_violation=必須是長度等於 {1} 的 {0}（實際長度為 {2}）
max_length_violation=必須是長度最多為 {1} 的 {0}（實際長度為 {2}）
min_length_violation=必須是長度至少為 {1} 的 {0}（實際長度為 {2}）
min_inclusive_violation=必須為大於或等於 {1} 的 {0}
min_exclusive_violation=必須為大於 {1} 的 {0}
max_inclusive_violation=必須為小於或等於 {1} 的 {0}
max_exclusive_violation=必須為小於 {1} 的 {0}
pattern_violation=必須為符合正則表現式 "{1}" 的 {0}
entity_violation=必須是名稱於DTD中宣告的非解析實體
undeclared_prefix=必須是QName，若有字首則需宣告（字首 "{0}" 未宣告）
precision_violation={0}必須包含最多 {1} 的有效數字（發現 {2} 個數字）
precision_1_violation={0}必須正好為一個有效數字（發現 {1} 個數字）
# part of the point is to avoid ugly "digit(s)" in the error message
scale_violation=必須為小數，在小數點後包含最多 {0} 的有效數字（發現 {1} 個數字）
scale_0_violation=必須為小數，在小數點後沒有任何有效數字
scale_1_violation=必須為小數，在小數點後包含一個有效數字（發現 {0} 個數字）
lexical_violation=必須為 {0}

# fragments substituted in above
lexical_space_string=一個字串
lexical_space_uri=一個URI
lexical_space_boolean=一個布林值
lexical_space_decimal=一個小數點
lexical_space_float=一個浮點數
lexical_space_duration=一段長度
lexical_space_hex=一個十六進位字串
lexical_space_base64=一個Base64字串
lexical_space_integer=一個整數
lexical_space_name=一個XML名稱
lexical_space_ncname=一個沒有分號的XML名稱
lexical_space_nmtoken=一個XML NMTOKEN
lexical_space_qname=一個XML QName
lexical_space_list=一份以空白分隔的清單
lexical_space_list_ncname=一份沒有分號XML名稱的清單
lexical_space_list_nmtoken=一份XML NMTOKEN的清單
lexical_space_date_y_m_d_time=一個ISO標準的日期時間
lexical_space_time=一個ISO標準時間
lexical_space_date_y_m_d=一個ISO標準日期
lexical_space_date_y_m=一個ISO標準年月
lexical_space_date_y=一年
lexical_space_date_m_d=一個ISO標準月日（格式為 --MM-DD）
lexical_space_date_m=一個ISO標準月份（格式為 --MM）
lexical_space_date_d=一個ISO標準的該月日期（格式為 --DD）
lexical_space_language=一個RFC3066標準的語言識別符
