# First block doesn't need to be translated for epubcheck, as @murata0204 noted in
# https://github.com/IDPF/epubcheck/pull/472#issuecomment-58265808

# Properties file specifying messages
enumeration_param="enumeration"-fasett er ikke tillatt som parameter: bruk "value"-elementet i stedet
whiteSpace_param="whiteSpace"-fasett er ikke tillatt som parameter
unrecognized_param=Ukjent parameter "{0}"
invalid_regex=Ugyldig regulært uttrykk: {0}
not_ordered=Parameteren kan kun brukes på ordnede datatyper
invalid_limit="{0}" er ikke tillatt av basistypen: {1}
no_length=basis datatypen definerer ikke en enhet for lengde
scale_not_derived_from_decimal="scale"-parameteren kan kun brukes på datatyper avledet fra "decimal"
scale_not_non_negative_integer="scale"-parameteren må være et ikke-negativt heltall
length_not_non_negative_integer="length"-parameteren må være et ikke-negativt heltall
precision_not_derived_from_decimal="precision"-parameteren kan kun brukes på datatyper avledet fra "decimal"
precision_not_positive_integer="precision"-parameteren må være et positivt heltall
regex_impl_not_found=Kan ikke finne implementasjon for regulært uttrykk; bruk JDK 1.4 eller legg til Xerces2 i classpath
regex_internal_error=Intern feil i regulært uttrykk for datatype {0}

# validation errors
length_violation=Må være {0} med lengde lik {1} (faktisk lengde var {2})
max_length_violation=Må være {0} med lengde på maks {1} (faktisk lengde var {2})
min_length_violation=Må være {0} med lengde på minst {1} (faktisk lengde var {2})
min_inclusive_violation=Må være {0} større enn eller lik {1}
min_exclusive_violation=Må være {0} større enn {1}
max_inclusive_violation=Må være {0} mindre enn eller lik {1}
max_exclusive_violation=Må være {0} mindre enn {1}
pattern_violation=Må være {0} som samsvarer med regulært uttrykk "{1}"
entity_violation=må være et navn deklarert i DTD-en som en uparslet enhet
undeclared_prefix=må være et QName der prefiks, hvis det finnes, er deklarert (prefiks "{0}" er ikke deklarert)
precision_violation=Må være {0} med høyst {1} signifikante sifre (fant {2} sifre)
precision_1_violation=Må være {0} med nøyaktig ett signifikant siffer (fant {1} sifre)
# part of the point is to avoid ugly "digit(s)" in the error message
scale_violation=Må være et desimaltall med høyst {0} signifikante sifre etter desimalpunktet (fant {1} sifre)
scale_0_violation=må være et desimaltall uten noe betydningsfulle sifre etter desimalpunktet
scale_1_violation=må være et desimaltall med maksimalt en signifikant desimal (fant {0} desimaler)
lexical_violation=må være {0}

