# First block doesn't need to be translated for epubcheck, as @murata0204 noted in
# https://github.com/IDPF/epubcheck/pull/472#issuecomment-58265808

# Properties file specifying messages
enumeration_param="enumeration"-facet er ikke tilladt som parameter: brug "value"-elementet i stedet
whiteSpace_param="whiteSpace"-facet er ikke tilladt som parameter
unrecognized_param=ukendt parameter "{0}"
invalid_regex=ikke-valid regular expression: {0}
not_ordered=parameter kan kun overføres til bestilt datatype
invalid_limit="{0}" er ikke tilladt af base type: {1}
no_length=base datatype definerer ikke en længdeenhed
scale_not_derived_from_decimal="scale" parameter kan kun anvendes til datatype afledt af "decimal"
scale_not_non_negative_integer="scale" parameter skal være et ikke-negativt heltal
length_not_non_negative_integer="length" parameter skal være et ikke-negativt heltal
precision_not_derived_from_decimal="precision" parameter kan kun anvendes til datatype afledt af  "decimal"
precision_not_positive_integer="precision" parameter skal være et positivt heltal
regex_impl_not_found=kan ikke finde regular expression implementation; brug JDK 1.4 eller tilføj Xerces2 til din "classpath"
regex_internal_error=intern fejl i regular expression for datatype {0}

# validation errors
length_violation=skal være {0} med en længde svarende til  {1} (faktisk længde var {2})
max_length_violation=skal være {0} med længde højst {1} (faktisk længde var {2})
min_length_violation=skal være {0} med længden mindst {1} (faktisk længde var {2})
min_inclusive_violation=skal være {0} større eller lig med {1}
min_exclusive_violation=skal være {0} større end {1}
max_inclusive_violation=skal være {0} mindre eller lig med {1}
max_exclusive_violation=skal være {0} mindre end {1}
pattern_violation=skal være {0} som svarer til det regulære udtryk "{1}"
entity_violation=skal være et navn deklareret i DTD’en som en ikke-gengivet enhed
undeclared_prefix=skal være et QName (kvalificeret navn) hvis prefix, hvis der er nogen, er deklareret (prefix "{0}" er ikke angivet)
precision_violation=skal være {0} med højst {1} signifikante cifre ({2} cifre fundet)
precision_1_violation=skal være {0} med præcis en signifikant ciffer ({1} cifre fundet)
# part of the point is to avoid ugly "digit(s)" in the error message
scale_violation=skal være et decimaltal med højst {0} signifikante cifre efter decimaltegnet ({1} cifre fundet)
scale_0_violation=skal være et decimaltal uden signifikante cifre efter decimaltegnet
scale_1_violation=skal være et decimaltal med højst et signifikant ciffer efter decimaltegnet ({0} cifre fundet)
lexical_violation=skal være {0}

# fragments substituted in above
lexical_space_string=en streng
lexical_space_uri=en URI
lexical_space_boolean=en boolean
lexical_space_decimal=et decimaltal
lexical_space_float=et "floating-point" tal
lexical_space_duration=en varighed
lexical_space_hex=en hexadecimal streng
lexical_space_base64=en base64 streng
lexical_space_integer=et heltal
lexical_space_name=et XML navn
lexical_space_ncname=et XML navn uden kolon
lexical_space_nmtoken=et XML NMTOKEN
lexical_space_qname=et XML QName
lexical_space_list=en whitespace-afgrænset liste
lexical_space_list_ncname=en liste med XML navne uden kolon
lexical_space_list_nmtoken=en liste med XML NMTOKENs
lexical_space_date_y_m_d_time=en ISO dato og tidspunkt
lexical_space_time=en ISO tidspunkt
lexical_space_date_y_m_d=en ISO dato
lexical_space_date_y_m=et ISO år og måned
lexical_space_date_y=et år
lexical_space_date_m_d=en ISO måned og dag (i formlaren --MM-DD)
lexical_space_date_m=en ISO måned (i formularen --MM)
lexical_space_date_d=en ISO dag i måneden (i formularen ---DD)
lexical_space_language=en RFC 3066 "language identifier" (sprogidentifikator)
