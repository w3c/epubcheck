help_text = EPUBCheck v%1$s\n\n\
          Quando si usa questo tool, il primo argomento deve essere il nome (con il percorso)\n\
          del file da controllare.\n\n\
          Per specificare un profilo di convalida (per eseguire controlli rispetto a uno specifico profilo EPUB 3\n\
          o a una specifica di estensione), utilizzare -profile option:\n\n\
          Profili di convalida supportati:\n\
          --profile default        = il profilo di convalida predefinito\n\
          --profile dict           = convalida rispetto alle specifiche EPUB per dizionari e glossari\n\
          --profile edupub         = convalida rispetto al profilo EDUPUB\n\
          --profile idx            = convalida rispetto alle specifiche EPUB per gli indici\n\
          --profile preview        = convalida rispetto alle specifiche EPUB per le anteprime\n\n\
          Se si controlla un file non in formato epub, è necessario specificare la versione epub del file utilizzando l'opzione -v e il tipo di file utilizzando l'opzione -mode.\n\n\
          La versione predefinita è: 3.0.\n\n\
          Modalità e versioni supportate:\n\
          --mode opf -v 2.0\n\
          --mode opf -v 3.0\n\
          --mode xhtml -v 2.0\n\
          --mode xhtml -v 3.0\n\
          --mode svg -v 2.0\n\
          --mode svg -v 3.0\n\
          --mode nav -v 3.0\n\
          --mode mo  -v 3.0        = per la convalida di Media Overlays\n\
          --mode exp               = per archivi EPUB espansi\n\n\
          Questo strumento accetta anche le seguenti opzioni::\n\
          --save                   = salva il file epub creato dall'epub espanso\n\
          --out <file>             = output an assessment XML document file (use - to output to console)\n\
          --xmp <file>             = output an assessment XMP document file (use - to output to console)\n\
          --json <file>            = output an assessment JSON document file (use - to output to console)\n\
          -m <file>                = equivalente di --mode\n\
          -p <profile>             = equivalente di --profile\n\
          -o <file>                = equivalente di --out\n\
          -x <file>                = equivalente di --xmp\n\
          -j <file>                = equivalente di --json\n\
          --maxOfEachMessage NUM   = limita a NUM il numero di messaggi riportati per ogni combinazione di ID messaggio e testo..\n\
          \                           Questa opzione si applica solo quando si genera un report in formato JSON o XML.\n\
          \                           Per impostazione predefinita, se questa opzione non è impostata, il report includerà un massimo di 25\n\
          \                           messaggi per ogni combinazione di ID messaggio e testo..\n\
          \                           È possibile utilizzare la parola chiave 'unlimited' o un valore negativo per rimuovere il limite e includere\n\
          \                           tutti i messaggi nel report..\n\n\
          --failonwarnings         = Per impostazione predefinita, lo strumento restituisce 1 se vengono rilevati errori nel file o 0 se non vengono rilevati errori.\n\
          \                           L'utilizzo di --failonwarnings farà sì che il processo termini con uno stato di\n\
          \                           1  se sono presenti avvisi o errori e 0 solo in assenza di errori o avvisi.\n\
          -q, --quiet              = nessun messaggio sulla console, eccetto gli errori, solo nell'output\n\
          -f, --fatal              = include solo gli errori fatali nell'output\n\
          -e, --error              = include solo i messaggi di errore e di gravità fatale nell'output\n\
          -w, --warn               = include i messaggi di gravità fatale, di errore e di avviso nell'output\n\
          -u, --usage              = include le informazioni sull'utilizzo delle funzionalità di ePub nell'output\n\
          \                           (l'impostazione predefinita è OFF); se abilitato, le informazioni sull'utilizzo saranno\n\
          \                           sempre incluse nel file di output\n\
          --locale <locale>        = visualizza i messaggi localizzati in base alla stringa del tag lingua IETF BCP 47 fornita.\n\n\
          -l, --listChecks [<file>]       = elenca gli ID dei messaggi e i livelli di gravità nel file di messaggi personalizzato denominato<file>\n\
          \                                  o nella console\n\
          -c, --customMessages [<file>]   =s ovrascrive i livelli di gravità dei messaggi come definiti nel file di messaggi personalizzato denominato  <file>\n\n\
          --version                = visualizza la versione di EPUBCheck\n\n\
          -h, -? or --help         = visualizza questo messaggio di aiuto\n\
          
