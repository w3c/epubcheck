help_text = EPUBCheck в%1$s\n\n\
          Када се овај алат извршава, први аргумент би требало да буде име (са путањом)\n\
          фајла који се проверава.\n\n\
          За навођење профила провере (који се извршава по одређеном EPUB 3 профилу\n\
          или проширењу спецификације), употребите -profile опцију:\n\n\
          Подржани су следећи профили провере:\n\
          --profile default        = подразумевани профил провере\n\
          --profile dict           = проверава по EPUB Dictionaries and Glossaries спецификацији\n\
          --profile edupub         = проверава по EDUPUB профилу\n\
          --profile idx            = проверава по EPUB Indexes спецификацији\n\
          --profile preview        = проверава по EPUB Previews спецификацији\n\n\
          Ако се проверава фајл који није epub, epub верзија фајла мора да се наведе\n\
          употребом -v и тип фајла употребом -mode.\n\
          Подразумевана верзија је: 3.0.\n\n\
          Подржавају се следећи режими и верзије:\n\
          --mode opf -v 2.0\n\
          --mode opf -v 3.0\n\
          --mode xhtml -v 2.0\n\
          --mode xhtml -v 3.0\n\
          --mode svg -v 2.0\n\
          --mode svg -v 3.0\n\
          --mode nav -v 3.0\n\
          --mode mo  -v 3.0        = за Media Overlays проверу\n\
          --mode exp               = за распаковане EPUB архиве\n\n\
          Овај алат такође подржава и следеће опције:\n\
          --save                   = чува epub креиран из распакованог epub\n\
          --out <file>             = исписује XML фајл документа процене (користите - да се испише на конзолу)\n\
          --xmp <file>             = исписује XMP фајл документа процене (користите - да се испише на конзолу)\n\
          --json <file>            = исписује JSON фајл документа процене (користите - да се испише на конзолу)\n\
          -m <file>                = исто као --mode\n\
          -p <profile>             = исто као --profile\n\
          -o <file>                = исто као --out\n\
          -x <file>                = исто као --xmp\n\
          -j <file>                = исто као --json\n\
          --maxOfEachMessage БР = ограничење броја порука које се издају за сваку ID-поруке-и-текст комбинацију на БР. Ова опција се примењује само када се прави извештај у JSON или XML формату. Ова опција се подразумевано не поставља, извештај ће да садржи максимално 25 порука за сваку ID-поруке-и-текст комбинацију. Кључна реч &#x27;unlimited&#x27; или негативна вредност могу да се употребе за уклањање ограничења и тако укључе све поруке у извештај.\n\
          --failonwarnings         = Алат подразумевано враћа 1 ако се у фајлу пронађу грешке, или 0 ако нема грешака.\n\
          \                           Употребом --failonwarnings ће се процес завршити са статусом\n\
          \                           1 ако има или грешака или упозорења и са 0 само онда када нема ни грешака ни упозорења.\n\
          -q, --quiet              = на конзоли нема порука, осим грешака, само у излазу\n\
          -f, --fatal              = на излаз се шаљу само фаталне грешке\n\
          -e, --error              = на излаз се шаљу само поруке чија је озбиљност грешка и фатална\n\
          -w, --warn               = на излаз се шаљу само поруке чија је озбиљност фатална грешка и упозорење\n\
          -u, --usage              = на излаз се шаљу информације о употреби ePub могућности\n\
          \                           (подразумевано је OFF); ако се укључи, информације о употреби ће се\n\
          \                           увек укључити у излазни фајл\n\
          --locale <locale>        = шаље на излаз локализоване поруке сагласно са наведеним IETF BCP 47 стрингом ознаке језика.\n\n\
          -l, --listChecks [<file>]       = исписује id порука и нивое озбиљности у фајл произвољних порука под именом <file>\n\
          \                                  или на конзолу\n\
          -c, --customMessages [<file>]   = преиначује нивое озбиљности порука онако како су дефинисани у фајлу произвољних порука под именом <file>\n\n\
          --version                = исписује EPUBCheck верзију\n\n\
          -h, -? или --help        = приказује ову поруку помоћи\n\
          
