help_text = EPUBCheck v%1$s\n\n\
          이 도구를 실행할 때 첫 번째 인자는 검사할 파일의 이름(경로 포함)이어야 합니다.\n\n\
          유효성 검사 프로(특정 EPUB 3 프로파일 또는 확장 사양에 대한 유효성 검사를 실행하기 위함)을 지정하려면 -profile 옵션을 사용하십시오:\n\n\
          지원되는 유효성 검사 프로파일: \n\
          --profile default = 기본 유효성 검사 프로파일 \n\
          --profile dict = EPUB 딕셔너리 및 용어집(Dictionaries and Glossaries) 사양에 대해 검사 \n\
          --profile edupub = EDUPUB 프로파일에 대해 검사 \n\
          --profile idx = EPUB 색인(Indexes) 사양에 대해 검사 \n\
          --profile preview = EPUB 미리보기(Previews) 사양에 대해 검사\n\n\
          epub 파일이 아닌 파일을 검사하는 경우, -v를 사용하여 파일의 epub 버전을 지정하고 -mode를 사용하여 파일의 유형을 지정해야 합니다. 기본 버전은 3.0입니다.\n\n\
          지원되는 모드 및 버전: \n\
          --mode opf -v 2.0 \n\
          --mode opf -v 3.0 \n\
          --mode xhtml -v 2.0 \n\
          --mode xhtml -v 3.0 \n\
          --mode svg -v 2.0 \n\
          --mode svg -v 3.0 \n\
          --mode nav -v 3.0 \n\
          --mode mo -v 3.0 = 미디어 오버레이(Media Overlays) 유효성 검사용 \n\
          --mode exp = 압축 해제된(expanded) EPUB 아카이브용\n\n\
          이 도구는 다음과 같은 옵션도 사용할 수 있습니다:\n\
          --save = 압축 해제된 epub에서 생성된 epub을 저장 \n\
          --out <file> = 평가 XML 문서 파일 출력 (콘솔로 출력하려면 - 사용) \n\
          --xmp <file> = 평가 XMP 문서 파일 출력 (콘솔로 출력하려면 - 사용) \n\
          --json <file> = 평가 JSON 문서 파일 출력 (콘솔로 출력하려면 - 사용) \n\
          -m <file> = --mode와 동일 \n\
          -p <profile> = --profile과 동일 \n\
          -o <file> = --out과 동일 \n\
          -x <file> = --xmp와 동일 \n\
          -j <file> = --json과 동일 \n\
          --maxOfEachMessage NUM = 메시지 ID와 텍스트 조합별로 보고되는 메시지 수를 NUM으로 제한합니다. 이 옵션은 JSON 또는 XML 형식 중 하나로 보고서를 생성할 때만 적용됩니다. 기본적으로 이 옵션을 설정하지 않으면 보고서에는 각 메시지 ID와 텍스트 조합당 최대 25개의 메시지만 포함됩니다. 'unlimited' 키워드 또는 음수 값을 사용하여 제한을 해제하고 모든 메시지를 보고서에 포함할 수 있습니다.\n\n\
          --failonwarnings = 기본적으로 도구는 파일에서 오류가 발견되면 1을 반환하고, 오류가 없으면 0을 반환합니다. --failonwarnings를 사용하면 경고 또는 오류가 있을 때 프로세스가 종료 상태 1로 종료되고, 오류나 경고가 모두 없을 때만 0으로 종료됩니다. \n\
          -q, --quiet = 콘솔에는 오류를 제외한 메시지를 표시하지 않고 출력 파일에만 표시 \n\
          -f, --fatal = 출력에 치명적 오류(fatal)만 포함 \n\
          -e, --error = 출력에 오류(error) 및 치명적(fatal) 심각도 메시지만 포함 \n\
          -w, --warn = 출력에 치명적(fatal), 오류(error), 경고(warn) 심각도 메시지 포함 \n\
          -u, --usage = 출력에 EPUB 기능 사용(usage) 정보를 포함 (기본값은 OFF); 활성화하면 사용 정보가 항상 출력 파일에 포함됨 \n\
          --locale <locale> = 제공된 IETF BCP 47 언어 태그 문자열에 따라 현지화된 메시지 출력.\n\n\
          -l, --listChecks [<file>] = <file>라는 이름의 사용자 지정 메시지 파일 또는 콘솔에 메시지 ID 및 심각도 수준 목록을 표시 \n\
          -c, --customMessages [<file>] = <file> 라는 이름의 사용자 지정 메시지 파일에 정의된 대로 메시지 심각도 수준을 재정의\n\n\
          --version = EPUBCheck 버전을 표시\n\n\
          -h, -? or --help = 이 도움말 메시지를 표시\n\
          
